info:
  name: Accept Quote
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseUrl}}/api/quotes/{{quoteId}}/accept"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "selectedCarrierId": "{{carrierId}}"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
