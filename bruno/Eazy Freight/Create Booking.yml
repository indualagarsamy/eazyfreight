info:
  name: Create Booking
  type: http
  seq: 10

http:
  method: POST
  url: "{{baseUrl}}/api/bookings"
  headers:
    - name: Content-Type
      value: application/json
    - name: X-Actor
      value: ops.jane
  body:
    type: json
    data: |-
      {
        "customerId": "{{customerId}}",
        "shipperId": "aabbccdd-1122-3344-5566-778899aabbcc",
        "consigneeId": "bbccddee-2233-4455-6677-8899aabbccdd",
        "shippingMode": "OCEAN_LCL",
        "originPortCode": "INBOM",
        "destinationPortCode": "SGSIN",
        "incoterms": "FOB",
        "requestedEtd": "2026-10-15",
        "requestedEta": "2026-11-08",
        "transportRequired": true,
        "pickupAddress": "Plot 14, MIDC Andheri, Mumbai",
        "cargoDetails": [
          {
            "description": "Machine parts",
            "hsCode": "8471.30.0100",
            "pieces": 10,
            "weightKg": 500.000,
            "lengthCm": 100.00,
            "widthCm": 100.00,
            "heightCm": 100.00,
            "hazmat": false,
            "temperatureControlled": false,
            "oversized": false
          }
        ]
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
