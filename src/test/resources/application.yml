spring:
  datasource:
    url: jdbc:h2:mem:eazyfreightdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  flyway:
    enabled: false

eazyfreight:
  alerts:
    scheduler:
      # The tests use a fixed clock. A background sweep running against it would
      # race with whatever the test is asserting about the alert list.
      enabled: false
