spring:
  application:
    name: eazyfreight-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:eazyfreightdb}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  flyway:
    enabled: true
    # migration-postgres holds constraints H2 cannot parse; see V5.
    locations: classpath:db/migration,classpath:db/migration-postgres

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: when-authorized
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: http://${JAEGER_HOST:localhost}:4318/v1/traces

eazyfreight:
  alerts:
    scheduler:
      enabled: true
      # Half-hourly, per the Alerts specification. Every threshold in the system is
      # measured in days or hours, so this is well inside the resolution of anything
      # being watched.
      interval-ms: 1800000
      initial-delay-ms: 30000
