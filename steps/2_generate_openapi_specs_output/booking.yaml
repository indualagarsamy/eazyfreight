openapi: 3.0.3
info:
  title: Booking API
  description: >-
    Booking endpoints. There is no PUT — every change is a named command
    against the aggregate, recorded in the status history. The X-Actor header
    names who is acting and is written into the audit trail. Derived from
    com.eazyfreight.booking.controller.BookingController.
  version: "1.0"
servers:
  - url: /api/bookings
tags:
  - name: booking
paths:
  /:
    get:
      tags: [booking]
      summary: List all bookings
      operationId: getAllBookings
      responses:
        "200":
          description: All bookings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BookingResponse'
    post:
      tags: [booking]
      summary: Create a booking request
      operationId: createBooking
      parameters:
        - name: X-Actor
          in: header
          required: false
          description: Actor recorded in the audit trail.
          schema:
            type: string
            default: operations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBookingRequest'
      responses:
        "201":
          description: Booking created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingResponse'
  /{id}:
    get:
      tags: [booking]
      summary: Get a booking by ID
      operationId: getBookingById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The booking
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingResponse'
  /by-reference/{bookingReference}:
    get:
      tags: [booking]
      summary: Get a booking by its booking reference
      operationId: getBookingByReference
      parameters:
        - name: bookingReference
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The booking
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingResponse'
  /{id}/status-history:
    get:
      tags: [booking]
      summary: Get the status history of a booking
      operationId: getBookingStatusHistory
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Status history entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BookingStatusHistoryResponse'
  /by-customer/{customerId}:
    get:
      tags: [booking]
      summary: List bookings for a customer
      operationId: getBookingsByCustomer
      parameters:
        - name: customerId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/BookingStatus'
      responses:
        "200":
          description: Bookings for the customer
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BookingResponse'
  /by-carrier/{carrierId}:
    get:
      tags: [booking]
      summary: List bookings for a carrier
      operationId: getBookingsByCarrier
      parameters:
        - name: carrierId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Bookings for the carrier
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BookingResponse'
  /pending-carrier-confirmation:
    get:
      tags: [booking]
      summary: List bookings pending carrier confirmation
      operationId: getPendingCarrierConfirmation
      responses:
        "200":
          description: Bookings pending carrier confirmation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BookingResponse'
  /approaching-etd:
    get:
      tags: [booking]
      summary: List bookings approaching their ETD
      operationId: getApproachingEtd
      parameters:
        - name: withinDays
          in: query
          required: false
          schema:
            type: integer
            default: 7
      responses:
        "200":
          description: Bookings approaching ETD
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BookingResponse'
  /{id}/submit:
    post:
      tags: [booking]
      summary: Submit the booking to a carrier
      operationId: submitBooking
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: X-Actor
          in: header
          required: false
          description: Actor recorded in the audit trail.
          schema:
            type: string
            default: operations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitBookingRequest'
      responses:
        "200":
          description: Submitted booking
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingResponse'
  /{id}/carrier-confirmation:
    post:
      tags: [booking]
      summary: Record the carrier's confirmation
      operationId: recordCarrierConfirmation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: X-Actor
          in: header
          required: false
          description: Actor recorded in the audit trail.
          schema:
            type: string
            default: operations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordCarrierConfirmationRequest'
      responses:
        "200":
          description: Booking with carrier confirmation recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingResponse'
  /{id}/carrier-rejection:
    post:
      tags: [booking]
      summary: Record the carrier's rejection
      operationId: recordCarrierRejection
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: X-Actor
          in: header
          required: false
          description: Actor recorded in the audit trail.
          schema:
            type: string
            default: operations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordCarrierRejectionRequest'
      responses:
        "200":
          description: Booking with carrier rejection recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingResponse'
  /{id}/counter-offer:
    post:
      tags: [booking]
      summary: Record a carrier counter-offer
      operationId: recordCounterOffer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: X-Actor
          in: header
          required: false
          description: Actor recorded in the audit trail.
          schema:
            type: string
            default: operations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordCounterOfferRequest'
      responses:
        "200":
          description: Booking with counter-offer recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingResponse'
  /{id}/counter-offer/accept:
    post:
      tags: [booking]
      summary: Accept the carrier's counter-offer
      operationId: acceptCounterOffer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: X-Actor
          in: header
          required: false
          description: Actor recorded in the audit trail.
          schema:
            type: string
            default: operations
      responses:
        "200":
          description: Booking with counter-offer accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingResponse'
  /{id}/counter-offer/reject:
    post:
      tags: [booking]
      summary: Reject the carrier's counter-offer
      operationId: rejectCounterOffer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: X-Actor
          in: header
          required: false
          description: Actor recorded in the audit trail.
          schema:
            type: string
            default: operations
      responses:
        "200":
          description: Booking with counter-offer rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingResponse'
  /{id}/acknowledge-etd-variance:
    post:
      tags: [booking]
      summary: Acknowledge an ETD variance from the requested date
      operationId: acknowledgeEtdVariance
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: X-Actor
          in: header
          required: false
          description: Actor recorded in the audit trail.
          schema:
            type: string
            default: operations
      responses:
        "200":
          description: Booking with ETD variance acknowledged
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingResponse'
  /{id}/send-confirmation:
    post:
      tags: [booking]
      summary: Send the confirmation to the customer
      operationId: sendConfirmation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: X-Actor
          in: header
          required: false
          description: Actor recorded in the audit trail.
          schema:
            type: string
            default: operations
      responses:
        "200":
          description: Booking with confirmation sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingResponse'
  /{id}/vessel-overbooking:
    post:
      tags: [booking]
      summary: Record a vessel overbooking by the carrier
      operationId: recordVesselOverbooking
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: X-Actor
          in: header
          required: false
          description: Actor recorded in the audit trail.
          schema:
            type: string
            default: operations
      responses:
        "200":
          description: Booking with vessel overbooking recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingResponse'
  /{id}/reinstate:
    post:
      tags: [booking]
      summary: Reinstate a booking after an overbooking, with new vessel details
      operationId: reinstateBooking
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: X-Actor
          in: header
          required: false
          description: Actor recorded in the audit trail.
          schema:
            type: string
            default: operations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReinstateBookingRequest'
      responses:
        "200":
          description: Reinstated booking
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingResponse'
  /{id}/cancel:
    post:
      tags: [booking]
      summary: Cancel the booking
      operationId: cancelBooking
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: X-Actor
          in: header
          required: false
          description: Actor recorded in the audit trail.
          schema:
            type: string
            default: operations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelBookingRequest'
      responses:
        "200":
          description: Cancelled booking
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingResponse'
components:
  schemas:
    ShippingMode:
      type: string
      description: Ocean only — this context does not handle air.
      enum: [OCEAN_FCL, OCEAN_LCL]
    BookingStatus:
      type: string
      enum:
        - BOOKING_REQUESTED
        - SUBMITTED_TO_CARRIER
        - REJECTED_BY_CARRIER
        - COUNTER_OFFER_RECEIVED
        - CONFIRMED_BY_CARRIER
        - CUSTOMER_CONFIRMED
        - VESSEL_OVERBOOKED
        - CANCELLED
    CancellationInitiator:
      type: string
      enum: [CUSTOMER, CARRIER_OVERBOOKING, OPERATIONS]
    StatusChangeSource:
      type: string
      enum: [MANUAL, INTTRA, SYSTEM]
    BookingSourceType:
      type: string
      enum: [DIRECT_CARRIER, CO_LOADER]
    ContainerType:
      type: string
      enum: [TWENTY_GP, FORTY_GP, FORTY_HC, FORTY_FIVE_HC]
    BookingCargoDetailRequest:
      type: object
      required:
        - description
        - hsCode
        - pieces
        - weightKg
        - lengthCm
        - widthCm
        - heightCm
        - valueUsd
      properties:
        description:
          type: string
          minLength: 1
        hsCode:
          type: string
          pattern: '\d{4}\.\d{2}\.\d{4}'
        pieces:
          type: integer
          minimum: 1
        weightKg:
          type: number
          minimum: 0.001
        lengthCm:
          type: number
          minimum: 0.01
        widthCm:
          type: number
          minimum: 0.01
        heightCm:
          type: number
          minimum: 0.01
        valueUsd:
          type: number
          minimum: 0.00
        hazmat:
          type: boolean
        temperatureControlled:
          type: boolean
        oversized:
          type: boolean
        marksAndNumbers:
          type: string
    BookingCargoDetailResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        description:
          type: string
        hsCode:
          type: string
        pieces:
          type: integer
        weightKg:
          type: number
        lengthCm:
          type: number
        widthCm:
          type: number
        heightCm:
          type: number
        cbm:
          type: number
        valueUsd:
          type: number
        hazmat:
          type: boolean
        temperatureControlled:
          type: boolean
        oversized:
          type: boolean
        marksAndNumbers:
          type: string
          nullable: true
    CreateBookingRequest:
      type: object
      required:
        - customerId
        - shipperId
        - consigneeId
        - shippingMode
        - originPortCode
        - destinationPortCode
        - incoterms
        - requestedEtd
        - cargoDetails
      properties:
        quoteId:
          type: string
          format: uuid
        customerId:
          type: string
          format: uuid
        shipperId:
          type: string
          format: uuid
        consigneeId:
          type: string
          format: uuid
        notifyPartyId:
          type: string
          format: uuid
        alsoNotifyId:
          type: string
          format: uuid
        shippingMode:
          $ref: '#/components/schemas/ShippingMode'
        originPortCode:
          type: string
          minLength: 1
        destinationPortCode:
          type: string
          minLength: 1
        incoterms:
          type: string
          minLength: 1
        requestedEtd:
          type: string
          format: date
        requestedEta:
          type: string
          format: date
        transportRequired:
          type: boolean
        pickupAddress:
          type: string
        pickupDateTime:
          type: string
          format: date-time
        specialInstructions:
          type: string
        marksAndNumbers:
          type: string
        cargoDetails:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/BookingCargoDetailRequest'
    SubmitBookingRequest:
      type: object
      required:
        - bookingSourceType
        - carrierId
      properties:
        bookingSourceType:
          $ref: '#/components/schemas/BookingSourceType'
        carrierId:
          type: string
          format: uuid
        containerType:
          $ref: '#/components/schemas/ContainerType'
        numberOfContainers:
          type: integer
          minimum: 1
    RecordCarrierConfirmationRequest:
      type: object
      required:
        - carrierBookingRef
        - vesselName
        - voyageNumber
        - confirmedEtd
        - confirmedEta
      properties:
        carrierBookingRef:
          type: string
          minLength: 1
        coLoaderBookingRef:
          type: string
        vesselName:
          type: string
          minLength: 1
        voyageNumber:
          type: string
          minLength: 1
        confirmedEtd:
          type: string
          format: date
        confirmedEta:
          type: string
          format: date
        containerType:
          $ref: '#/components/schemas/ContainerType'
        confirmedAt:
          type: string
          format: date-time
    RecordCarrierRejectionRequest:
      type: object
      required:
        - reason
      properties:
        reason:
          type: string
          minLength: 1
    RecordCounterOfferRequest:
      type: object
      required:
        - proposedVessel
        - proposedVoyage
        - proposedEtd
        - proposedEta
      properties:
        proposedVessel:
          type: string
          minLength: 1
        proposedVoyage:
          type: string
          minLength: 1
        proposedEtd:
          type: string
          format: date
        proposedEta:
          type: string
          format: date
    ReinstateBookingRequest:
      type: object
      required:
        - newVesselName
        - newVoyageNumber
        - newEtd
        - newEta
      properties:
        newVesselName:
          type: string
          minLength: 1
        newVoyageNumber:
          type: string
          minLength: 1
        newEtd:
          type: string
          format: date
        newEta:
          type: string
          format: date
        reason:
          type: string
    CancelBookingRequest:
      type: object
      required:
        - reason
        - initiatedBy
      properties:
        reason:
          type: string
          minLength: 1
        initiatedBy:
          $ref: '#/components/schemas/CancellationInitiator'
    BookingStatusHistoryResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        sequenceNumber:
          type: integer
        fromStatus:
          $ref: '#/components/schemas/BookingStatus'
        toStatus:
          $ref: '#/components/schemas/BookingStatus'
        changedAt:
          type: string
          format: date-time
        changedBy:
          type: string
        reason:
          type: string
          nullable: true
        source:
          $ref: '#/components/schemas/StatusChangeSource'
    BookingReinstatementResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        previousVessel:
          type: string
        previousVoyage:
          type: string
        previousEtd:
          type: string
          format: date
        previousEta:
          type: string
          format: date
        newVesselName:
          type: string
        newVoyageNumber:
          type: string
        newEtd:
          type: string
          format: date
        newEta:
          type: string
          format: date
        reinstatedAt:
          type: string
          format: date-time
        reinstatedBy:
          type: string
        reason:
          type: string
          nullable: true
    CarrierBookingResponse:
      type: object
      nullable: true
      properties:
        id:
          type: string
          format: uuid
        bookingSourceType:
          $ref: '#/components/schemas/BookingSourceType'
        carrierId:
          type: string
          format: uuid
        carrierBookingRef:
          type: string
          nullable: true
        coLoaderBookingRef:
          type: string
          nullable: true
        vesselName:
          type: string
          nullable: true
        voyageNumber:
          type: string
          nullable: true
        confirmedEtd:
          type: string
          format: date
          nullable: true
        confirmedEta:
          type: string
          format: date
          nullable: true
        containerType:
          $ref: '#/components/schemas/ContainerType'
        numberOfContainers:
          type: integer
          nullable: true
        submittedAt:
          type: string
          format: date-time
          nullable: true
        confirmedAt:
          type: string
          format: date-time
          nullable: true
        confirmedBy:
          type: string
          nullable: true
    BookingResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        bookingReference:
          type: string
        quoteId:
          type: string
          format: uuid
          nullable: true
        customerId:
          type: string
          format: uuid
        shipperId:
          type: string
          format: uuid
        consigneeId:
          type: string
          format: uuid
        notifyPartyId:
          type: string
          format: uuid
          nullable: true
        alsoNotifyId:
          type: string
          format: uuid
          nullable: true
        status:
          $ref: '#/components/schemas/BookingStatus'
        shippingMode:
          $ref: '#/components/schemas/ShippingMode'
        originPortCode:
          type: string
        destinationPortCode:
          type: string
        incoterms:
          type: string
        requestedEtd:
          type: string
          format: date
        requestedEta:
          type: string
          format: date
          nullable: true
        transportRequired:
          type: boolean
        pickupAddress:
          type: string
          nullable: true
        pickupDateTime:
          type: string
          format: date-time
          nullable: true
        specialInstructions:
          type: string
          nullable: true
        marksAndNumbers:
          type: string
          nullable: true
        cancellationReason:
          type: string
          nullable: true
        cancellationInitiatedBy:
          $ref: '#/components/schemas/CancellationInitiator'
        cancelledAt:
          type: string
          format: date-time
          nullable: true
        requiresCustomerEtdNotification:
          type: boolean
          description: >-
            True when the confirmed ETD moved more than two business days
            from what the customer asked for; the confirmation is blocked
            until acknowledged.
        etdVarianceAcknowledgedAt:
          type: string
          format: date-time
          nullable: true
        confirmationSentAt:
          type: string
          format: date-time
          nullable: true
        itnFiled:
          type: boolean
        totalWeightKg:
          type: number
        totalValueUsd:
          type: number
        createdAt:
          type: string
          format: date-time
        createdBy:
          type: string
        lastModifiedAt:
          type: string
          format: date-time
        lastModifiedBy:
          type: string
        carrierBooking:
          $ref: '#/components/schemas/CarrierBookingResponse'
        cargoDetails:
          type: array
          items:
            $ref: '#/components/schemas/BookingCargoDetailResponse'
        statusHistory:
          type: array
          items:
            $ref: '#/components/schemas/BookingStatusHistoryResponse'
        reinstatements:
          type: array
          items:
            $ref: '#/components/schemas/BookingReinstatementResponse'
