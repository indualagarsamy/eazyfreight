openapi: 3.0.3
info:
  title: Quote API
  description: >-
    Quote lifecycle endpoints. Lifecycle changes are POSTs to named
    sub-resources (/send, /accept, /decline) rather than a PUT that lets a
    caller set status to anything. Derived from
    com.eazyfreight.quote.controller.QuoteController.
  version: "1.0"
servers:
  - url: /api/quotes
tags:
  - name: quote
paths:
  /:
    get:
      tags: [quote]
      summary: List all quotes
      operationId: getAllQuotes
      responses:
        "200":
          description: All quotes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/QuoteResponse'
    post:
      tags: [quote]
      summary: Create a quote request
      operationId: createQuote
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateQuoteRequest'
      responses:
        "201":
          description: Quote created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteResponse'
  /{id}:
    get:
      tags: [quote]
      summary: Get a quote by ID
      operationId: getQuoteById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The quote
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteResponse'
  /by-reference/{quoteReference}:
    get:
      tags: [quote]
      summary: Get a quote by its quote reference
      operationId: getQuoteByReference
      parameters:
        - name: quoteReference
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The quote
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteResponse'
  /open:
    get:
      tags: [quote]
      summary: List open quotes
      operationId: getOpenQuotes
      responses:
        "200":
          description: Open quotes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/QuoteResponse'
  /expiring:
    get:
      tags: [quote]
      summary: List quotes expiring within a window
      operationId: getExpiringQuotes
      parameters:
        - name: withinDays
          in: query
          required: false
          schema:
            type: integer
            default: 3
      responses:
        "200":
          description: Expiring quotes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/QuoteResponse'
  /by-customer/{customerId}:
    get:
      tags: [quote]
      summary: List quotes for a customer
      operationId: getQuotesByCustomer
      parameters:
        - name: customerId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/QuoteStatus'
      responses:
        "200":
          description: Quotes for the customer
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/QuoteResponse'
  /rates:
    get:
      tags: [quote]
      summary: Look up carrier rates for a lane
      operationId: getRatesForLane
      parameters:
        - name: originPortCode
          in: query
          required: true
          schema:
            type: string
        - name: destinationPortCode
          in: query
          required: true
          schema:
            type: string
        - name: mode
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/ShippingMode'
      responses:
        "200":
          description: Rates for the lane
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RateResponse'
  /{id}/rescreen:
    post:
      tags: [quote]
      summary: Re-run screening on a quote request
      operationId: rescreenQuote
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateQuoteRequest'
      responses:
        "200":
          description: Rescreened quote
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteResponse'
  /{id}/build:
    post:
      tags: [quote]
      summary: Build the quotation (pricing lines) for a quote
      operationId: buildQuote
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BuildQuotationRequest'
      responses:
        "200":
          description: Quote with quotation built
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteResponse'
  /{id}/send:
    post:
      tags: [quote]
      summary: Send the quote to the customer
      operationId: sendQuote
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Sent quote
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteResponse'
  /{id}/accept:
    post:
      tags: [quote]
      summary: Accept the quote and select a carrier
      operationId: acceptQuote
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptQuoteRequest'
      responses:
        "200":
          description: Accepted quote
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteResponse'
  /{id}/decline:
    post:
      tags: [quote]
      summary: Decline the quote
      operationId: declineQuote
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeclineQuoteRequest'
      responses:
        "200":
          description: Declined quote
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteResponse'
  /{id}/expire:
    post:
      tags: [quote]
      summary: Force-expire the quote
      operationId: expireQuote
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Expired quote
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteResponse'
components:
  schemas:
    ChargeUnit:
      type: string
      enum: [TEU, CBM, KG, FLAT]
    QuoteLineType:
      type: string
      enum: [BASE_FREIGHT, BAF, CAF, PSS, THC_ORIGIN, THC_DESTINATION, DOC_FEE, INSURANCE]
    ShippingMode:
      type: string
      enum: [OCEAN_FCL, OCEAN_LCL, AIR]
    QuoteStatus:
      type: string
      enum: [DRAFT, SENT, ACCEPTED, DECLINED, EXPIRED]
    ScreeningStatus:
      type: string
      enum: [PENDING, CLEARED, FLAGGED]
    RateType:
      type: string
      enum: [CONTRACT, SPOT]
    SurchargeType:
      type: string
      enum: [BAF, CAF, PSS, THC_ORIGIN, THC_DESTINATION, DOC_FEE]
    CargoDetailRequest:
      type: object
      required:
        - description
        - hsCode
        - pieces
        - weightKg
        - lengthCm
        - widthCm
        - heightCm
      properties:
        description:
          type: string
          minLength: 1
        hsCode:
          type: string
          pattern: '\d{4}\.\d{2}\.\d{4}'
        pieces:
          type: integer
          minimum: 1
        weightKg:
          type: number
          minimum: 0.001
        lengthCm:
          type: number
          minimum: 0.01
        widthCm:
          type: number
          minimum: 0.01
        heightCm:
          type: number
          minimum: 0.01
        hazmat:
          type: boolean
        temperatureControlled:
          type: boolean
        oversized:
          type: boolean
    CargoDetailResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        description:
          type: string
        hsCode:
          type: string
        pieces:
          type: integer
        weightKg:
          type: number
        lengthCm:
          type: number
        widthCm:
          type: number
        heightCm:
          type: number
        volumetricWeightCbm:
          type: number
        volumetricWeightKg:
          type: number
        chargeableWeight:
          type: number
        chargeableUnit:
          $ref: '#/components/schemas/ChargeUnit'
        hazmat:
          type: boolean
        temperatureControlled:
          type: boolean
        oversized:
          type: boolean
    CreateQuoteRequest:
      type: object
      required:
        - customerId
        - shippingMode
        - originPortCode
        - destinationPortCode
        - incoterms
        - cargoDetails
        - currency
        - shipperName
        - consigneeName
      properties:
        customerId:
          type: string
          format: uuid
        shippingMode:
          $ref: '#/components/schemas/ShippingMode'
        originPortCode:
          type: string
          minLength: 1
        destinationPortCode:
          type: string
          minLength: 1
        incoterms:
          type: string
          minLength: 1
        cargoDetails:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/CargoDetailRequest'
        requestedEtd:
          type: string
          format: date
        specialHandling:
          type: string
        insuranceRequired:
          type: boolean
        currency:
          type: string
          pattern: '[A-Z]{3}'
          minLength: 1
          description: ISO 4217 currency code.
        shipperName:
          type: string
          minLength: 1
        shipperAddress:
          type: string
        shipperCountry:
          type: string
        consigneeName:
          type: string
          minLength: 1
        consigneeAddress:
          type: string
        consigneeCountry:
          type: string
    QuoteLineRequest:
      type: object
      required:
        - lineType
        - description
        - buyRate
        - sellRate
        - quantity
        - unit
      properties:
        lineType:
          $ref: '#/components/schemas/QuoteLineType'
        description:
          type: string
          minLength: 1
        buyRate:
          type: number
          minimum: 0.00
        sellRate:
          type: number
          minimum: 0.00
        quantity:
          type: number
          minimum: 0.0001
        unit:
          $ref: '#/components/schemas/ChargeUnit'
    BuildQuotationRequest:
      type: object
      required:
        - lines
        - validityDays
      properties:
        lines:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/QuoteLineRequest'
        validityDays:
          type: integer
          minimum: 1
        rateValidUntil:
          type: string
          format: date
          description: >-
            Earliest expiry among the carrier rates these lines were priced
            from; acceptance is refused once it passes.
        spotRate:
          type: boolean
        notes:
          type: string
    AcceptQuoteRequest:
      type: object
      required:
        - selectedCarrierId
      properties:
        selectedCarrierId:
          type: string
          format: uuid
    DeclineQuoteRequest:
      type: object
      properties:
        reason:
          type: string
    QuoteLineResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        lineType:
          $ref: '#/components/schemas/QuoteLineType'
        description:
          type: string
        buyRate:
          type: number
        sellRate:
          type: number
        currency:
          type: string
        quantity:
          type: number
        unit:
          $ref: '#/components/schemas/ChargeUnit'
        amount:
          type: number
    QuoteResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        quoteReference:
          type: string
        customerId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/QuoteStatus'
        shippingMode:
          $ref: '#/components/schemas/ShippingMode'
        originPortCode:
          type: string
        destinationPortCode:
          type: string
        incoterms:
          type: string
        selectedCarrierId:
          type: string
          format: uuid
          nullable: true
        screeningStatus:
          $ref: '#/components/schemas/ScreeningStatus'
        screeningReferenceId:
          type: string
          nullable: true
        requestedEtd:
          type: string
          format: date
          nullable: true
        validFrom:
          type: string
          format: date
          nullable: true
        validUntil:
          type: string
          format: date
          nullable: true
        rateValidUntil:
          type: string
          format: date
          nullable: true
        createdAt:
          type: string
          format: date-time
        sentAt:
          type: string
          format: date-time
          nullable: true
        acceptedAt:
          type: string
          format: date-time
          nullable: true
        declinedAt:
          type: string
          format: date-time
          nullable: true
        expiredAt:
          type: string
          format: date-time
          nullable: true
        declineReason:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
        totalBuyRate:
          type: number
          nullable: true
        totalSellRate:
          type: number
          nullable: true
        margin:
          type: number
          nullable: true
        currency:
          type: string
          nullable: true
        spotRate:
          type: boolean
        specialHandling:
          type: string
          nullable: true
        insuranceRequired:
          type: boolean
        quoteLines:
          type: array
          items:
            $ref: '#/components/schemas/QuoteLineResponse'
        cargoDetails:
          type: array
          items:
            $ref: '#/components/schemas/CargoDetailResponse'
    SurchargeResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        surchargeType:
          $ref: '#/components/schemas/SurchargeType'
        amount:
          type: number
        currency:
          type: string
        validFrom:
          type: string
          format: date
        validUntil:
          type: string
          format: date
        expired:
          type: boolean
    RateResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        laneId:
          type: string
          format: uuid
        carrierId:
          type: string
          format: uuid
        buyRate:
          type: number
        currency:
          type: string
        rateType:
          $ref: '#/components/schemas/RateType'
        unit:
          $ref: '#/components/schemas/ChargeUnit'
        transitDays:
          type: integer
          nullable: true
        validFrom:
          type: string
          format: date
        validUntil:
          type: string
          format: date
        expired:
          type: boolean
          description: >-
            True when this rate has lapsed as of the lookup date. Expired
            rates are returned rather than hidden, so operations can see that
            the lane is stale instead of quietly pricing from it.
        surcharges:
          type: array
          items:
            $ref: '#/components/schemas/SurchargeResponse'
