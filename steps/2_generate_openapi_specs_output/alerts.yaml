openapi: 3.0.3
info:
  title: Alerts API
  description: >-
    Alert lifecycle and configuration endpoints. Derived from
    com.eazyfreight.alerts.controller.AlertController.
  version: "1.0"
servers:
  - url: /api/alerts
tags:
  - name: alerts
paths:
  /:
    get:
      tags: [alerts]
      summary: List open alerts, optionally filtered by category and/or track
      operationId: open
      parameters:
        - name: category
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/AlertCategory'
        - name: track
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/AlertTrack'
      responses:
        "200":
          description: Open alerts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AlertView'
  /dashboard:
    get:
      tags: [alerts]
      summary: The "what needs attention right now" dashboard view
      operationId: dashboard
      responses:
        "200":
          description: Alert dashboard
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dashboard'
  /overdue:
    get:
      tags: [alerts]
      summary: List overdue alerts
      operationId: overdue
      responses:
        "200":
          description: Overdue alerts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AlertView'
  /{id}:
    get:
      tags: [alerts]
      summary: Get an alert by ID
      operationId: byId
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The alert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertView'
  /bookings/{bookingId}:
    get:
      tags: [alerts]
      summary: List alerts for a booking
      operationId: forBooking
      parameters:
        - name: bookingId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Alerts for the booking
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AlertView'
  /configurations:
    get:
      tags: [alerts]
      summary: List alert type configurations
      operationId: configurations
      responses:
        "200":
          description: Alert configurations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ConfigurationView'
  /evaluate:
    post:
      tags: [alerts]
      summary: >-
        Force the alert sweep the scheduler runs every half hour, across all
        bookings.
      operationId: evaluate
      responses:
        "200":
          description: Evaluation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluateAllResult'
  /bookings/{bookingId}/evaluate:
    post:
      tags: [alerts]
      summary: Force the alert sweep for a single booking
      operationId: evaluateBooking
      parameters:
        - name: bookingId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Evaluation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluateBookingResult'
  /{id}/acknowledge:
    post:
      tags: [alerts]
      summary: Acknowledge an alert
      operationId: acknowledge
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: X-Actor
          in: header
          required: false
          description: Actor recorded in the audit trail.
          schema:
            type: string
            default: operations
      responses:
        "200":
          description: Acknowledged alert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertView'
  /{id}/snooze:
    post:
      tags: [alerts]
      summary: Snooze an alert until a given time
      operationId: snooze
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: X-Actor
          in: header
          required: false
          description: Actor recorded in the audit trail.
          schema:
            type: string
            default: operations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Snooze'
      responses:
        "200":
          description: Snoozed alert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertView'
  /{id}/resolve:
    post:
      tags: [alerts]
      summary: Resolve an alert
      operationId: resolve
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: X-Actor
          in: header
          required: false
          description: Actor recorded in the audit trail.
          schema:
            type: string
            default: operations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Resolve'
      responses:
        "200":
          description: Resolved alert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertView'
  /configurations/{alertType}:
    put:
      tags: [alerts]
      summary: >-
        Replace an alert type's configuration. The sole PUT in this API,
        because it replaces the whole configuration record.
      operationId: updateConfiguration
      parameters:
        - name: alertType
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/AlertType'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateConfiguration'
      responses:
        "200":
          description: Updated configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigurationView'
components:
  schemas:
    AlertCategory:
      type: string
      description: How much business damage the condition does if nobody acts.
      enum: [CRITICAL, HIGH, MEDIUM, LOW]
    AlertTrack:
      type: string
      description: Which operational track the condition belongs to.
      enum: [LOGISTICS, COMPLIANCE, FINANCE, BOOKING, DOCUMENTATION]
    AlertStatus:
      type: string
      enum: [ACTIVE, ACKNOWLEDGED, SNOOZED, ESCALATED, RESOLVED]
    DeliveryStatus:
      type: string
      enum: [PENDING, DELIVERED, FAILED]
    NotificationChannel:
      type: string
      enum: [IN_APP, EMAIL, SMS]
    RecipientRole:
      type: string
      enum:
        - OPERATIONS_STAFF
        - COMPLIANCE_STAFF
        - ACCOUNTING_STAFF
        - OPERATIONS_MANAGEMENT
        - FINANCE_MANAGEMENT
        - MANAGEMENT
    AlertHistoryAction:
      type: string
      enum:
        - CREATED
        - NOTIFICATION_SENT
        - ACKNOWLEDGED
        - SNOOZED
        - REACTIVATED
        - ESCALATED
        - DEADLINE_RECALCULATED
        - RESOLVED
    AlertType:
      type: string
      description: The thirty-one alert definitions from the specification, as data.
      enum:
        - L001_CONTAINER_NOT_DISPATCHED
        - L002_CONTAINER_NOT_DELIVERED_TO_CUSTOMER
        - L003_CUSTOMER_LOADING_OVERDUE
        - L004_INBOUND_BLOCKED_NO_ITN
        - L005_EARLY_PORT_DELIVERY_RISK
        - L006_CBP_HOLD_CUTOFF_AT_RISK
        - L007_SEAL_NUMBER_NOT_RECORDED
        - L008_CONTAINER_NOT_DELIVERED_TO_PORT
        - C001_EEI_NOT_INITIATED
        - C002_EEI_NOT_SUBMITTED
        - C003_EEI_REJECTED
        - C004_ITN_NOT_RECEIVED_APPROACHING_CUTOFF
        - C005_ITN_MISSING_CUTOFF_BREACHED
        - C006_EEI_AMENDMENT_REQUIRED
        - C007_LEGAL_DEADLINE_APPROACHING
        - F001_INVOICE_NOT_ISSUED
        - F002_PAYMENT_APPROACHING_DUE
        - F003_PAYMENT_OVERDUE
        - F004_CREDIT_HOLD_THRESHOLD
        - F005_CARRIER_PAYMENT_DUE
        - F006_CARRIER_PAYMENT_OVERDUE
        - F007_CARRIER_INVOICE_DISCREPANCY
        - F008_STORAGE_FEE_ACCRUING
        - B001_CARRIER_CONFIRMATION_NOT_RECEIVED
        - B002_VESSEL_OVERBOOKING
        - B003_REINSTATEMENT_RECALCULATION
        - B004_ETD_CHANGED_BY_CARRIER
        - D001_CUTOFF_APPROACHING_PRECONDITIONS_UNMET
        - D002_INSTRUCTIONS_NOT_SENT
        - D003_MASTER_BOL_NOT_RECEIVED
        - D004_HOUSE_BOL_NOT_GENERATED
    Snooze:
      type: object
      required:
        - until
      properties:
        until:
          type: string
          format: date-time
    Resolve:
      type: object
      required:
        - reason
      properties:
        reason:
          type: string
          minLength: 1
    UpdateConfiguration:
      type: object
      required:
        - escalationHours
        - channels
        - snoozeMaxHours
      properties:
        enabled:
          type: boolean
        thresholdDays:
          type: integer
          nullable: true
        escalationHours:
          type: integer
          minimum: 1
        channels:
          type: array
          uniqueItems: true
          minItems: 1
          items:
            $ref: '#/components/schemas/NotificationChannel'
        snoozeMaxHours:
          type: integer
          minimum: 1
        customMessage:
          type: string
    HistoryEntry:
      type: object
      properties:
        id:
          type: string
          format: uuid
        sequenceNumber:
          type: integer
        action:
          $ref: '#/components/schemas/AlertHistoryAction'
        occurredAt:
          type: string
          format: date-time
        actor:
          type: string
        notes:
          type: string
          nullable: true
    NotificationView:
      type: object
      properties:
        id:
          type: string
          format: uuid
        channel:
          $ref: '#/components/schemas/NotificationChannel'
        recipientRole:
          $ref: '#/components/schemas/RecipientRole'
        sentAt:
          type: string
          format: date-time
        deliveredAt:
          type: string
          format: date-time
          nullable: true
        deliveryStatus:
          $ref: '#/components/schemas/DeliveryStatus'
        failureReason:
          type: string
          nullable: true
        simulated:
          type: boolean
    AlertView:
      type: object
      properties:
        id:
          type: string
          format: uuid
        bookingId:
          type: string
          format: uuid
        bookingReference:
          type: string
        alertType:
          $ref: '#/components/schemas/AlertType'
        alertCode:
          type: string
        track:
          $ref: '#/components/schemas/AlertTrack'
        category:
          $ref: '#/components/schemas/AlertCategory'
        status:
          $ref: '#/components/schemas/AlertStatus'
        title:
          type: string
        message:
          type: string
        recommendedAction:
          type: string
        recipients:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/RecipientRole'
        createdAt:
          type: string
          format: date-time
        deadlineAt:
          type: string
          format: date-time
          nullable: true
        lastEvaluatedAt:
          type: string
          format: date-time
        overdue:
          type: boolean
        acknowledgedAt:
          type: string
          format: date-time
          nullable: true
        acknowledgedBy:
          type: string
          nullable: true
        snoozedUntil:
          type: string
          format: date-time
          nullable: true
        snoozedBy:
          type: string
          nullable: true
        escalatedAt:
          type: string
          format: date-time
          nullable: true
        escalatedTo:
          $ref: '#/components/schemas/RecipientRole'
        resolvedAt:
          type: string
          format: date-time
          nullable: true
        resolvedBy:
          type: string
          nullable: true
        resolutionReason:
          type: string
          nullable: true
        maxSnoozeHours:
          type: integer
        history:
          type: array
          items:
            $ref: '#/components/schemas/HistoryEntry'
        notifications:
          type: array
          items:
            $ref: '#/components/schemas/NotificationView'
    Dashboard:
      type: object
      description: >-
        The "what needs attention right now" view — counts by severity and by
        track, plus how many alerts nobody has looked at and how many have
        run past their deadline.
      properties:
        open:
          type: integer
        byCategory:
          type: object
          description: Map keyed by AlertCategory name to a count.
          additionalProperties:
            type: integer
        byTrack:
          type: object
          description: Map keyed by AlertTrack name to a count.
          additionalProperties:
            type: integer
        unacknowledged:
          type: integer
        escalated:
          type: integer
        overdue:
          type: integer
        bookingsAffected:
          type: integer
    ConfigurationView:
      type: object
      properties:
        alertType:
          $ref: '#/components/schemas/AlertType'
        alertCode:
          type: string
        track:
          $ref: '#/components/schemas/AlertTrack'
        title:
          type: string
        category:
          $ref: '#/components/schemas/AlertCategory'
        enabled:
          type: boolean
        thresholdDays:
          type: integer
          nullable: true
        escalationHours:
          type: integer
        channels:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/NotificationChannel'
        snoozeMaxHours:
          type: integer
        snoozeCeilingHours:
          type: integer
        customMessage:
          type: string
          nullable: true
        recipients:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/RecipientRole'
    EvaluateAllResult:
      type: object
      description: Fixed-shape map returned by POST /evaluate (not a DTO record).
      properties:
        changes:
          type: integer
        open:
          type: integer
    EvaluateBookingResult:
      type: object
      description: Fixed-shape map returned by POST /bookings/{bookingId}/evaluate (not a DTO record).
      properties:
        changes:
          type: integer
