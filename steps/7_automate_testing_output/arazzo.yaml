arazzo: 1.1.0
info:
  title: Quote to Outbound Dispatch Workflow
  summary: Price a shipment, book it, get carrier confirmation, and dispatch the truck that collects the cargo.
  description: >-
    An Arazzo workflow chaining one endpoint each from three of eazyfreight's
    bounded-context OpenAPI specs in this folder: quote, booking, and
    logistics. None of those three specs reference each other directly (each
    bounded context duplicates the concepts it needs rather than $ref-ing a
    sibling context — see ../5_build_domain_language_output/domain_language.md);
    this document is where the cross-context sequencing that a real
    "new-shipment" operation performs is expressed instead.

    1. **createQuote** (quote) prices the shipment for the customer.
    2. **createBooking** (booking) converts the priced quote into a booking,
       reusing the lane/party/mode fields the quote step returned. The
       booking starts in BOOKING_REQUESTED — not yet confirmed by a carrier.
    3. **submitBooking** (booking) submits the booking to a carrier.
    4. **recordCarrierConfirmation** (booking) records the carrier's
       confirmation, moving the booking to CONFIRMED_BY_CARRIER.
    5. **dispatchOutboundTruck** (logistics) dispatches the truck that picks
       the cargo up from the shipper, using the booking's `bookingId`.
       `LogisticsService.dispatchOutbound` (`requireConfirmedBooking`)
       refuses this call unless the booking is CONFIRMED_BY_CARRIER or
       CUSTOMER_CONFIRMED, which is why steps 3-4 exist — an earlier draft
       of this workflow went straight from createBooking to
       dispatchOutboundTruck and failed that precondition.
  version: 1.1.0
sourceDescriptions:
  - name: quoteApi
    url: quote/quote.yaml
    type: openapi
  - name: bookingApi
    url: booking/booking.yaml
    type: openapi
  - name: logisticsApi
    url: logistics/logistics.yaml
    type: openapi
workflows:
  - workflowId: quoteToOutboundDispatch
    summary: Quote -> Booking -> Carrier confirmation -> Outbound truck dispatch
    description: >-
      Runs a shipment from a fresh price quote through booking confirmation
      to the first physical logistics event (the outbound truck dispatch that
      collects cargo from the shipper). `bookingApi`'s ShippingMode is
      ocean-only (no AIR), so this workflow's `shippingMode` input is
      restricted to the two ocean values so the booking step can never
      receive a mode it rejects. `submitBooking` and
      `recordCarrierConfirmation` are required between createBooking and
      dispatchOutboundTruck because `logisticsApi.dispatchOutbound` refuses
      to run against a booking that hasn't been carrier-confirmed yet.
    inputs:
      type: object
      required:
        - customerId
        - shipperId
        - consigneeId
        - shippingMode
        - originPortCode
        - destinationPortCode
        - incoterms
        - currency
        - shipperName
        - consigneeName
        - requestedEtd
        - cargoDetails
        - pickupAddress
        - deliveryAddress
        - carrierId
        - carrierBookingRef
        - vesselName
        - voyageNumber
        - confirmedEtd
        - confirmedEta
      properties:
        customerId:
          type: string
          format: uuid
          description: Customer the quote and booking are placed for (quoteApi.CreateQuoteRequest.customerId and bookingApi.CreateBookingRequest.customerId; required by both).
        shipperId:
          type: string
          format: uuid
          description: Shipper party for the booking (bookingApi.CreateBookingRequest.shipperId, required). Not modeled on the quote, which only carries shipper name/address instead of an id.
        consigneeId:
          type: string
          format: uuid
          description: Consignee party for the booking (bookingApi.CreateBookingRequest.consigneeId, required). Not modeled on the quote, which only carries consignee name/address instead of an id.
        shippingMode:
          type: string
          enum: [OCEAN_FCL, OCEAN_LCL]
          description: Transport mode for the lane (quoteApi.CreateQuoteRequest.shippingMode and bookingApi.CreateBookingRequest.shippingMode; required by both). Restricted to the two ocean values here because bookingApi's ShippingMode enum is ocean-only, while quoteApi's also allows AIR.
        originPortCode:
          type: string
          minLength: 1
          description: Port-of-origin code (quoteApi.CreateQuoteRequest.originPortCode and bookingApi.CreateBookingRequest.originPortCode; required by both).
        destinationPortCode:
          type: string
          minLength: 1
          description: Port-of-destination code (quoteApi.CreateQuoteRequest.destinationPortCode and bookingApi.CreateBookingRequest.destinationPortCode; required by both).
        incoterms:
          type: string
          minLength: 1
          description: Incoterms rule governing the shipment, e.g. FOB or CIF (quoteApi.CreateQuoteRequest.incoterms and bookingApi.CreateBookingRequest.incoterms; required by both, modeled as a free-text string in both specs).
        currency:
          type: string
          pattern: '[A-Z]{3}'
          description: ISO 4217 currency code for the quote (quoteApi.CreateQuoteRequest.currency, required; $refs quoteApi's common/Currency.schema.json, which enforces this 3-letter pattern). Not used by createBooking or dispatchOutboundTruck.
        shipperName:
          type: string
          minLength: 1
          description: Shipper's legal name (quoteApi.CreateQuoteRequest.shipperName, required). Used only by createQuote — bookingApi identifies the shipper by shipperId instead.
        shipperAddress:
          type: string
          description: Shipper's address (quoteApi.CreateQuoteRequest.shipperAddress, optional). Used only by createQuote.
        shipperCountry:
          type: string
          description: Shipper's country (quoteApi.CreateQuoteRequest.shipperCountry, optional). Used only by createQuote.
        consigneeName:
          type: string
          minLength: 1
          description: Consignee's legal name (quoteApi.CreateQuoteRequest.consigneeName, required). Used only by createQuote — bookingApi identifies the consignee by consigneeId instead.
        consigneeAddress:
          type: string
          description: Consignee's address (quoteApi.CreateQuoteRequest.consigneeAddress, optional). Used only by createQuote.
        consigneeCountry:
          type: string
          description: Consignee's country (quoteApi.CreateQuoteRequest.consigneeCountry, optional). Used only by createQuote.
        requestedEtd:
          type: string
          format: date
          description: Requested estimated time of departure. Optional on quoteApi.CreateQuoteRequest.requestedEtd but required on bookingApi.CreateBookingRequest.requestedEtd, so this input is required for the workflow as a whole.
        pickupAddress:
          type: string
          description: Where the outbound truck collects the cargo, i.e. the shipper's premises (bookingApi.CreateBookingRequest.pickupAddress, optional there, and logisticsApi.DispatchTruck.pickupAddress, required there — hence required on this workflow).
        pickupDateTime:
          type: string
          format: date-time
          description: When the outbound truck is expected to collect the cargo, as recorded on the booking (bookingApi.CreateBookingRequest.pickupDateTime, optional). Distinct from scheduledPickupDate below, which is recorded on the dispatch itself.
        deliveryAddress:
          type: string
          description: Where the outbound truck delivers the cargo, i.e. the carrier yard or port terminal (logisticsApi.DispatchTruck.deliveryAddress, required). Not modeled on the booking, which has no delivery-address field.
        scheduledPickupDate:
          type: string
          format: date-time
          description: Scheduled pickup timestamp for the outbound dispatch (logisticsApi.DispatchTruck.scheduledPickupDate, optional).
        scheduledDeliveryDate:
          type: string
          format: date-time
          description: Scheduled delivery timestamp for the outbound dispatch (logisticsApi.DispatchTruck.scheduledDeliveryDate, optional).
        driverId:
          type: string
          format: uuid
          description: Driver assigned to the outbound dispatch (logisticsApi.DispatchTruck.driverId, optional).
        truckingVendorId:
          type: string
          format: uuid
          description: Trucking vendor assigned to the outbound dispatch (logisticsApi.DispatchTruck.truckingVendorId, optional).
        vehicleReference:
          type: string
          description: Vehicle or plate reference for the outbound dispatch (logisticsApi.DispatchTruck.vehicleReference, optional).
        actor:
          type: string
          default: operations
          description: Written into the X-Actor header on the booking and logistics commands, both of which record it in their audit trail (bookingApi and logisticsApi both document X-Actor as "Actor recorded in the audit trail," optional, defaulting to "operations").
        carrierId:
          type: string
          format: uuid
          description: Carrier the booking is submitted to (bookingApi.SubmitBookingRequest.carrierId, required).
        containerType:
          type: string
          enum: [TWENTY_GP, FORTY_GP, FORTY_HC, FORTY_FIVE_HC]
          description: Container type for the booking (bookingApi.SubmitBookingRequest.containerType and bookingApi.RecordCarrierConfirmationRequest.containerType, both optional; same value reused for both calls).
        numberOfContainers:
          type: integer
          minimum: 1
          description: Number of containers for the booking (bookingApi.SubmitBookingRequest.numberOfContainers, optional).
        carrierBookingRef:
          type: string
          minLength: 1
          description: Carrier's reference for this booking (bookingApi.RecordCarrierConfirmationRequest.carrierBookingRef, required).
        vesselName:
          type: string
          minLength: 1
          description: Vessel the carrier confirmed (bookingApi.RecordCarrierConfirmationRequest.vesselName, required).
        voyageNumber:
          type: string
          minLength: 1
          description: Voyage number the carrier confirmed (bookingApi.RecordCarrierConfirmationRequest.voyageNumber, required).
        confirmedEtd:
          type: string
          format: date
          description: Carrier-confirmed estimated time of departure (bookingApi.RecordCarrierConfirmationRequest.confirmedEtd, required).
        confirmedEta:
          type: string
          format: date
          description: Carrier-confirmed estimated time of arrival (bookingApi.RecordCarrierConfirmationRequest.confirmedEta, required).
        cargoDetails:
          type: array
          minItems: 1
          description: >-
            Physical cargo detail. Sent to createQuote as-is (its
            CargoDetailRequest schema ignores the booking-only valueUsd/
            marksAndNumbers fields) and again to createBooking, which
            requires valueUsd.
          items:
            type: object
            required:
              - description
              - hsCode
              - pieces
              - weightKg
              - lengthCm
              - widthCm
              - heightCm
              - valueUsd
            properties:
              description:
                type: string
                minLength: 1
                description: Cargo description (common/CargoDimensionsInput.schema.json#/properties/description, required, shared identically by quoteApi and bookingApi).
              hsCode:
                type: string
                pattern: '\d{4}\.\d{2}\.\d{4}'
                description: Harmonized System tariff code, formatted NNNN.NN.NNNN (common/CargoDimensionsInput.schema.json#/properties/hsCode, required, shared identically by quoteApi and bookingApi).
              pieces:
                type: integer
                minimum: 1
                description: Number of pieces in this cargo item (common/CargoDimensionsInput.schema.json#/properties/pieces, required, shared identically by quoteApi and bookingApi).
              weightKg:
                type: number
                minimum: 0.001
                description: Weight of this cargo item, in kilograms (common/CargoDimensionsInput.schema.json#/properties/weightKg, required, shared identically by quoteApi and bookingApi).
              lengthCm:
                type: number
                minimum: 0.01
                description: Length of this cargo item, in centimeters (common/CargoDimensionsInput.schema.json#/properties/lengthCm, required, shared identically by quoteApi and bookingApi).
              widthCm:
                type: number
                minimum: 0.01
                description: Width of this cargo item, in centimeters (common/CargoDimensionsInput.schema.json#/properties/widthCm, required, shared identically by quoteApi and bookingApi).
              heightCm:
                type: number
                minimum: 0.01
                description: Height of this cargo item, in centimeters (common/CargoDimensionsInput.schema.json#/properties/heightCm, required, shared identically by quoteApi and bookingApi).
              hazmat:
                type: boolean
                description: Whether this cargo item is hazardous material (common/CargoDimensionsInput.schema.json#/properties/hazmat, optional, shared identically by quoteApi and bookingApi).
              temperatureControlled:
                type: boolean
                description: Whether this cargo item requires temperature control (common/CargoDimensionsInput.schema.json#/properties/temperatureControlled, optional, shared identically by quoteApi and bookingApi).
              oversized:
                type: boolean
                description: Whether this cargo item is oversized (common/CargoDimensionsInput.schema.json#/properties/oversized, optional, shared identically by quoteApi and bookingApi).
              valueUsd:
                type: number
                minimum: 0
                description: Booking-only field; ignored by the quote step.
              marksAndNumbers:
                type: string
                description: Booking-only field; ignored by the quote step.
    steps:
      - stepId: createQuote
        description: Price the shipment for the customer.
        operationId: quoteApi.createQuote
        requestBody:
          contentType: application/json
          payload:
            customerId: $inputs.customerId
            shippingMode: $inputs.shippingMode
            originPortCode: $inputs.originPortCode
            destinationPortCode: $inputs.destinationPortCode
            incoterms: $inputs.incoterms
            requestedEtd: $inputs.requestedEtd
            currency: $inputs.currency
            shipperName: $inputs.shipperName
            shipperAddress: $inputs.shipperAddress
            shipperCountry: $inputs.shipperCountry
            consigneeName: $inputs.consigneeName
            consigneeAddress: $inputs.consigneeAddress
            consigneeCountry: $inputs.consigneeCountry
            cargoDetails: $inputs.cargoDetails
        successCriteria:
          - condition: $statusCode == 201
        outputs:
          quoteId: $response.body#/id
          quoteReference: $response.body#/quoteReference
          customerId: $response.body#/customerId
          shippingMode: $response.body#/shippingMode
          originPortCode: $response.body#/originPortCode
          destinationPortCode: $response.body#/destinationPortCode
          incoterms: $response.body#/incoterms

      - stepId: createBooking
        description: Convert the priced quote into a confirmed booking.
        operationId: bookingApi.createBooking
        parameters:
          - name: X-Actor
            in: header
            value: $inputs.actor
        requestBody:
          contentType: application/json
          payload:
            quoteId: $steps.createQuote.outputs.quoteId
            customerId: $steps.createQuote.outputs.customerId
            shipperId: $inputs.shipperId
            consigneeId: $inputs.consigneeId
            shippingMode: $steps.createQuote.outputs.shippingMode
            originPortCode: $steps.createQuote.outputs.originPortCode
            destinationPortCode: $steps.createQuote.outputs.destinationPortCode
            incoterms: $steps.createQuote.outputs.incoterms
            requestedEtd: $inputs.requestedEtd
            pickupAddress: $inputs.pickupAddress
            pickupDateTime: $inputs.pickupDateTime
            cargoDetails: $inputs.cargoDetails
        successCriteria:
          - condition: $statusCode == 201
        outputs:
          bookingId: $response.body#/id
          bookingReference: $response.body#/bookingReference

      - stepId: submitBooking
        description: Submit the booking to the carrier.
        operationId: bookingApi.submitBooking
        parameters:
          - name: id
            in: path
            value: $steps.createBooking.outputs.bookingId
          - name: X-Actor
            in: header
            value: $inputs.actor
        requestBody:
          contentType: application/json
          payload:
            bookingSourceType: DIRECT_CARRIER
            carrierId: $inputs.carrierId
            containerType: $inputs.containerType
            numberOfContainers: $inputs.numberOfContainers
        successCriteria:
          - condition: $statusCode == 200
        outputs:
          bookingId: $response.body#/id
          bookingStatus: $response.body#/status

      - stepId: recordCarrierConfirmation
        description: Record the carrier's confirmation, unblocking outbound dispatch.
        operationId: bookingApi.recordCarrierConfirmation
        parameters:
          - name: id
            in: path
            value: $steps.submitBooking.outputs.bookingId
          - name: X-Actor
            in: header
            value: $inputs.actor
        requestBody:
          contentType: application/json
          payload:
            carrierBookingRef: $inputs.carrierBookingRef
            vesselName: $inputs.vesselName
            voyageNumber: $inputs.voyageNumber
            confirmedEtd: $inputs.confirmedEtd
            confirmedEta: $inputs.confirmedEta
            containerType: $inputs.containerType
        successCriteria:
          - condition: $statusCode == 200
        outputs:
          bookingId: $response.body#/id
          bookingStatus: $response.body#/status

      - stepId: dispatchOutboundTruck
        description: Dispatch the truck that collects the cargo from the shipper.
        operationId: logisticsApi.dispatchOutbound
        parameters:
          - name: bookingId
            in: path
            value: $steps.recordCarrierConfirmation.outputs.bookingId
          - name: X-Actor
            in: header
            value: $inputs.actor
        requestBody:
          contentType: application/json
          payload:
            pickupAddress: $inputs.pickupAddress
            deliveryAddress: $inputs.deliveryAddress
            driverId: $inputs.driverId
            truckingVendorId: $inputs.truckingVendorId
            vehicleReference: $inputs.vehicleReference
            scheduledPickupDate: $inputs.scheduledPickupDate
            scheduledDeliveryDate: $inputs.scheduledDeliveryDate
        successCriteria:
          - condition: $statusCode == 201
        outputs:
          logisticsId: $response.body#/id
          logisticsStage: $response.body#/stage
          dispatchId: $response.body#/dispatches/0/id

    outputs:
      quoteId: $steps.createQuote.outputs.quoteId
      quoteReference: $steps.createQuote.outputs.quoteReference
      bookingId: $steps.createBooking.outputs.bookingId
      bookingReference: $steps.createBooking.outputs.bookingReference
      bookingStatus: $steps.recordCarrierConfirmation.outputs.bookingStatus
      logisticsId: $steps.dispatchOutboundTruck.outputs.logisticsId
      logisticsStage: $steps.dispatchOutboundTruck.outputs.logisticsStage
