arazzo: 1.1.0
info:
  title: Quote to Outbound Dispatch Workflow
  summary: Price a shipment, convert it into a booking, and dispatch the truck that collects the cargo.
  description: >-
    An Arazzo workflow chaining one endpoint each from three of eazyfreight's
    bounded-context OpenAPI specs in this folder: quote, booking, and
    logistics. None of those three specs reference each other directly (each
    bounded context duplicates the concepts it needs rather than $ref-ing a
    sibling context — see ../5_build_domain_language_output/domain_language.md);
    this document is where the cross-context sequencing that a real
    "new-shipment" operation performs is expressed instead.

    1. **createQuote** (quote) prices the shipment for the customer.
    2. **createBooking** (booking) converts the priced quote into a confirmed
       booking, reusing the lane/party/mode fields the quote step returned.
    3. **dispatchOutboundTruck** (logistics) dispatches the truck that picks
       the cargo up from the shipper, using the booking step's `bookingId`.
  version: 1.0.0
sourceDescriptions:
  - name: quoteApi
    url: quote/quote.yaml
    type: openapi
  - name: bookingApi
    url: booking/booking.yaml
    type: openapi
  - name: logisticsApi
    url: logistics/logistics.yaml
    type: openapi
workflows:
  - workflowId: quoteToOutboundDispatch
    summary: Quote -> Booking -> Outbound truck dispatch
    description: >-
      Runs a shipment from a fresh price quote through booking confirmation
      to the first physical logistics event (the outbound truck dispatch that
      collects cargo from the shipper). `bookingApi`'s ShippingMode is
      ocean-only (no AIR), so this workflow's `shippingMode` input is
      restricted to the two ocean values so the booking step can never
      receive a mode it rejects.
    inputs:
      type: object
      required:
        - customerId
        - shipperId
        - consigneeId
        - shippingMode
        - originPortCode
        - destinationPortCode
        - incoterms
        - currency
        - shipperName
        - consigneeName
        - requestedEtd
        - cargoDetails
        - pickupAddress
        - deliveryAddress
      properties:
        customerId:
          type: string
          format: uuid
          description: Customer the quote and booking are placed for.
        shipperId:
          type: string
          format: uuid
          description: Shipper party for the booking (not modeled on the quote, which only carries shipper name/address).
        consigneeId:
          type: string
          format: uuid
          description: Consignee party for the booking.
        shippingMode:
          type: string
          enum: [OCEAN_FCL, OCEAN_LCL]
        originPortCode:
          type: string
        destinationPortCode:
          type: string
        incoterms:
          type: string
        currency:
          type: string
          pattern: '[A-Z]{3}'
          description: ISO 4217 currency code for the quote.
        shipperName:
          type: string
        shipperAddress:
          type: string
        shipperCountry:
          type: string
        consigneeName:
          type: string
        consigneeAddress:
          type: string
        consigneeCountry:
          type: string
        requestedEtd:
          type: string
          format: date
        pickupAddress:
          type: string
          description: Where the outbound truck collects the cargo (shipper premises); also recorded on the booking.
        pickupDateTime:
          type: string
          format: date-time
        deliveryAddress:
          type: string
          description: Where the outbound truck delivers the cargo (carrier yard or port terminal).
        scheduledPickupDate:
          type: string
          format: date-time
        scheduledDeliveryDate:
          type: string
          format: date-time
        driverId:
          type: string
          format: uuid
        truckingVendorId:
          type: string
          format: uuid
        vehicleReference:
          type: string
        actor:
          type: string
          default: operations
          description: Written into the X-Actor header on the booking and logistics commands, both of which record it in their audit trail.
        cargoDetails:
          type: array
          minItems: 1
          description: >-
            Physical cargo detail. Sent to createQuote as-is (its
            CargoDetailRequest schema ignores the booking-only valueUsd/
            marksAndNumbers fields) and again to createBooking, which
            requires valueUsd.
          items:
            type: object
            required:
              - description
              - hsCode
              - pieces
              - weightKg
              - lengthCm
              - widthCm
              - heightCm
              - valueUsd
            properties:
              description:
                type: string
              hsCode:
                type: string
                pattern: '\d{4}\.\d{2}\.\d{4}'
              pieces:
                type: integer
                minimum: 1
              weightKg:
                type: number
                minimum: 0.001
              lengthCm:
                type: number
                minimum: 0.01
              widthCm:
                type: number
                minimum: 0.01
              heightCm:
                type: number
                minimum: 0.01
              hazmat:
                type: boolean
              temperatureControlled:
                type: boolean
              oversized:
                type: boolean
              valueUsd:
                type: number
                minimum: 0
                description: Booking-only field; ignored by the quote step.
              marksAndNumbers:
                type: string
                description: Booking-only field; ignored by the quote step.
    steps:
      - stepId: createQuote
        description: Price the shipment for the customer.
        operationId: quoteApi.createQuote
        requestBody:
          contentType: application/json
          payload:
            customerId: $inputs.customerId
            shippingMode: $inputs.shippingMode
            originPortCode: $inputs.originPortCode
            destinationPortCode: $inputs.destinationPortCode
            incoterms: $inputs.incoterms
            requestedEtd: $inputs.requestedEtd
            currency: $inputs.currency
            shipperName: $inputs.shipperName
            shipperAddress: $inputs.shipperAddress
            shipperCountry: $inputs.shipperCountry
            consigneeName: $inputs.consigneeName
            consigneeAddress: $inputs.consigneeAddress
            consigneeCountry: $inputs.consigneeCountry
            cargoDetails: $inputs.cargoDetails
        successCriteria:
          - condition: $statusCode == 201
        outputs:
          quoteId: $response.body#/id
          quoteReference: $response.body#/quoteReference
          customerId: $response.body#/customerId
          shippingMode: $response.body#/shippingMode
          originPortCode: $response.body#/originPortCode
          destinationPortCode: $response.body#/destinationPortCode
          incoterms: $response.body#/incoterms

      - stepId: createBooking
        description: Convert the priced quote into a confirmed booking.
        operationId: bookingApi.createBooking
        parameters:
          - name: X-Actor
            in: header
            value: $inputs.actor
        requestBody:
          contentType: application/json
          payload:
            quoteId: $steps.createQuote.outputs.quoteId
            customerId: $steps.createQuote.outputs.customerId
            shipperId: $inputs.shipperId
            consigneeId: $inputs.consigneeId
            shippingMode: $steps.createQuote.outputs.shippingMode
            originPortCode: $steps.createQuote.outputs.originPortCode
            destinationPortCode: $steps.createQuote.outputs.destinationPortCode
            incoterms: $steps.createQuote.outputs.incoterms
            requestedEtd: $inputs.requestedEtd
            pickupAddress: $inputs.pickupAddress
            pickupDateTime: $inputs.pickupDateTime
            cargoDetails: $inputs.cargoDetails
        successCriteria:
          - condition: $statusCode == 201
        outputs:
          bookingId: $response.body#/id
          bookingReference: $response.body#/bookingReference

      - stepId: dispatchOutboundTruck
        description: Dispatch the truck that collects the cargo from the shipper.
        operationId: logisticsApi.dispatchOutbound
        parameters:
          - name: bookingId
            in: path
            value: $steps.createBooking.outputs.bookingId
          - name: X-Actor
            in: header
            value: $inputs.actor
        requestBody:
          contentType: application/json
          payload:
            pickupAddress: $inputs.pickupAddress
            deliveryAddress: $inputs.deliveryAddress
            driverId: $inputs.driverId
            truckingVendorId: $inputs.truckingVendorId
            vehicleReference: $inputs.vehicleReference
            scheduledPickupDate: $inputs.scheduledPickupDate
            scheduledDeliveryDate: $inputs.scheduledDeliveryDate
        successCriteria:
          - condition: $statusCode == 201
        outputs:
          logisticsId: $response.body#/id
          logisticsStage: $response.body#/stage
          dispatchId: $response.body#/dispatches/0/id

    outputs:
      quoteId: $steps.createQuote.outputs.quoteId
      quoteReference: $steps.createQuote.outputs.quoteReference
      bookingId: $steps.createBooking.outputs.bookingId
      bookingReference: $steps.createBooking.outputs.bookingReference
      logisticsId: $steps.dispatchOutboundTruck.outputs.logisticsId
      logisticsStage: $steps.dispatchOutboundTruck.outputs.logisticsStage
