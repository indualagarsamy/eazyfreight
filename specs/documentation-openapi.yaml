openapi: 3.0.3
info:
  title: EazyFreight Documentation API
  version: "1.0.0"
  description: Documentation endpoints — the twenty-one commands from the specification.
servers:
  - url: /api/documentation
tags:
  - name: documentation
paths:
  /api/documentation/bookings/{bookingId}/preconditions:
    get:
      tags: [documentation]
      operationId: checkPreconditions
      summary: Check documentation preconditions for a booking
      parameters:
        - $ref: '#/components/parameters/BookingId'
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Preconditions'
  /api/documentation/bookings/{bookingId}/instructions:
    get:
      tags: [documentation]
      operationId: getInstructionsForBooking
      summary: List Master BOL instructions for a booking
      parameters:
        - $ref: '#/components/parameters/BookingId'
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Instructions'
    post:
      tags: [documentation]
      operationId: compileInstructions
      summary: Compile the Master BOL instructions for a booking
      parameters:
        - $ref: '#/components/parameters/BookingId'
        - $ref: '#/components/parameters/ActorHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompileInstructions'
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Instructions'
  /api/documentation/bookings/{bookingId}/master-bols:
    get:
      tags: [documentation]
      operationId: getMasterBolsForBooking
      summary: List Master BOLs for a booking
      parameters:
        - $ref: '#/components/parameters/BookingId'
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Master'
  /api/documentation/bookings/{bookingId}/house-bols:
    get:
      tags: [documentation]
      operationId: getHouseBolsForBooking
      summary: List House BOLs for a booking
      parameters:
        - $ref: '#/components/parameters/BookingId'
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/House'
  /api/documentation/house-bols:
    get:
      tags: [documentation]
      operationId: getActiveHouseBols
      summary: List active House BOLs
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/House'
  /api/documentation/house-bols/{id}:
    get:
      tags: [documentation]
      operationId: getHouseBol
      summary: Get a House BOL by id
      parameters:
        - $ref: '#/components/parameters/HouseBolId'
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/House'
  /api/documentation/house-bols/by-number/{houseBolNumber}/revisions:
    get:
      tags: [documentation]
      operationId: getHouseBolRevisions
      summary: List every revision of a House BOL number, oldest first
      parameters:
        - name: houseBolNumber
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/House'
  /api/documentation/instructions/{id}/approve:
    post:
      tags: [documentation]
      operationId: approveInstructions
      summary: Approve the Master BOL instructions
      parameters:
        - $ref: '#/components/parameters/InstructionsId'
        - $ref: '#/components/parameters/ActorHeader'
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Instructions'
  /api/documentation/instructions/{id}/send:
    post:
      tags: [documentation]
      operationId: sendInstructions
      summary: Send the Master BOL instructions to the carrier
      parameters:
        - $ref: '#/components/parameters/InstructionsId'
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Instructions'
  /api/documentation/instructions/{id}/carrier-query:
    post:
      tags: [documentation]
      operationId: recordCarrierQuery
      summary: Record a carrier query against the instructions
      parameters:
        - $ref: '#/components/parameters/InstructionsId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CarrierQuery'
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Instructions'
  /api/documentation/instructions/{id}/resend-corrected:
    post:
      tags: [documentation]
      operationId: resendCorrectedInstructions
      summary: Resend corrected Master BOL instructions
      parameters:
        - $ref: '#/components/parameters/InstructionsId'
        - $ref: '#/components/parameters/ActorHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompileInstructions'
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Instructions'
  /api/documentation/instructions/{id}/master-bol:
    post:
      tags: [documentation]
      operationId: recordMasterBolReceived
      summary: Record that the Master BOL was received from the carrier
      parameters:
        - $ref: '#/components/parameters/InstructionsId'
        - $ref: '#/components/parameters/ActorHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MasterBOLReceived'
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Master'
  /api/documentation/master-bols/{id}/verify:
    post:
      tags: [documentation]
      operationId: verifyMasterBol
      summary: Verify the Master BOL
      parameters:
        - $ref: '#/components/parameters/MasterBolId'
        - $ref: '#/components/parameters/ActorHeader'
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Master'
  /api/documentation/master-bols/{id}/discrepancy:
    post:
      tags: [documentation]
      operationId: raiseDiscrepancy
      summary: Raise a discrepancy against the Master BOL
      parameters:
        - $ref: '#/components/parameters/MasterBolId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Discrepancy'
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Master'
  /api/documentation/master-bols/{id}/correction:
    post:
      tags: [documentation]
      operationId: recordMasterBolCorrection
      summary: Record a Master BOL correction
      parameters:
        - $ref: '#/components/parameters/MasterBolId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MasterBOLCorrection'
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Master'
  /api/documentation/master-bols/{id}/house-bol:
    post:
      tags: [documentation]
      operationId: generateHouseBol
      summary: Confirm the release type and generate the House BOL
      parameters:
        - $ref: '#/components/parameters/MasterBolId'
        - $ref: '#/components/parameters/ActorHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateHouseBOL'
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/House'
  /api/documentation/house-bols/{id}/pdf:
    post:
      tags: [documentation]
      operationId: generateHouseBolPdf
      summary: >
        Render the House BOL PDF and return it as a download. The command and
        the file are one round trip.
      parameters:
        - $ref: '#/components/parameters/HouseBolId'
      responses:
        "200":
          description: OK
          content:
            application/pdf:
              schema:
                type: string
                format: binary
    get:
      tags: [documentation]
      operationId: downloadHouseBolPdf
      summary: Re-download a House BOL PDF already produced (renders again; records nothing)
      parameters:
        - $ref: '#/components/parameters/HouseBolId'
      responses:
        "200":
          description: OK
          content:
            application/pdf:
              schema:
                type: string
                format: binary
  /api/documentation/house-bols/{id}/distribute:
    post:
      tags: [documentation]
      operationId: distributeHouseBol
      summary: Send the House BOL to the shipper, consignee agent, or notify party
      parameters:
        - $ref: '#/components/parameters/HouseBolId'
        - $ref: '#/components/parameters/ActorHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Distribute'
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/House'
  /api/documentation/house-bols/{id}/originals/release:
    post:
      tags: [documentation]
      operationId: releaseOriginals
      summary: Release the original House BOLs
      parameters:
        - $ref: '#/components/parameters/HouseBolId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReleaseOriginals'
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/House'
  /api/documentation/house-bols/{id}/originals/surrender:
    post:
      tags: [documentation]
      operationId: surrenderOriginals
      summary: Record original House BOLs surrendered
      parameters:
        - $ref: '#/components/parameters/HouseBolId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SurrenderOriginals'
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/House'
  /api/documentation/house-bols/{id}/amend:
    post:
      tags: [documentation]
      operationId: amendHouseBol
      summary: Request and apply a House BOL amendment
      parameters:
        - $ref: '#/components/parameters/HouseBolId'
        - $ref: '#/components/parameters/ActorHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AmendHouseBOL'
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/House'
  /api/documentation/house-bols/{id}/void:
    post:
      tags: [documentation]
      operationId: voidHouseBol
      summary: Void the House BOL
      parameters:
        - $ref: '#/components/parameters/HouseBolId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VoidHouseBOL'
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/House'
components:
  parameters:
    BookingId:
      name: bookingId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    InstructionsId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MasterBolId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    HouseBolId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ActorHeader:
      name: X-Actor
      in: header
      required: false
      schema:
        type: string
        default: operations
      description: Actor recorded in the audit trail.
  schemas:
    InstructionsStatus:
      type: string
      enum: [DRAFT, APPROVED, SENT, QUERIED, SUPERSEDED]
    VerificationStatus:
      type: string
      enum: [PENDING, VERIFIED, DISCREPANCY_RAISED, CORRECTED]
    HouseBOLStatus:
      type: string
      enum: [ISSUED, VOIDED]
    ReleaseType:
      type: string
      enum: [ORIGINAL_BOL, TELEX_RELEASE, SEA_WAYBILL]
    FreightTerms:
      type: string
      enum: [PREPAID, COLLECT]
    DistributionRecipient:
      type: string
      enum: [SHIPPER, CONSIGNEE_AGENT, NOTIFY_PARTY]
    DistributionChannel:
      type: string
      enum: [EMAIL, PORTAL, COURIER]
    CompileInstructions:
      type: object
      description: >
        Overrides for the instruction snapshot. Everything else is pulled
        from the booking, logistics and compliance records at compile time.
      properties:
        shipperName:
          type: string
        shipperAddress:
          type: string
        consigneeName:
          type: string
        consigneeAddress:
          type: string
        notifyPartyName:
          type: string
        notifyPartyAddress:
          type: string
        marksAndNumbers:
          type: string
        freightTerms:
          $ref: '#/components/schemas/FreightTerms'
        documentationCutOffDate:
          type: string
          format: date
    CarrierQuery:
      type: object
      required:
        - query
      properties:
        query:
          type: string
          minLength: 1
    MasterBOLReceived:
      type: object
      required:
        - masterBolNumber
      properties:
        masterBolNumber:
          type: string
          minLength: 1
        issuedByCarrierAt:
          type: string
          format: date-time
        documentFileReference:
          type: string
    Discrepancy:
      type: object
      required:
        - discrepancyFields
      properties:
        discrepancyFields:
          type: array
          minItems: 1
          items:
            type: string
    MasterBOLCorrection:
      type: object
      properties:
        correctedMasterBolNumber:
          type: string
        documentFileReference:
          type: string
    GenerateHouseBOL:
      type: object
      required:
        - releaseType
      properties:
        releaseType:
          $ref: '#/components/schemas/ReleaseType'
        freightTerms:
          $ref: '#/components/schemas/FreightTerms'
    Distribute:
      type: object
      required:
        - recipient
      properties:
        recipient:
          $ref: '#/components/schemas/DistributionRecipient'
        recipientName:
          type: string
        recipientAddress:
          type: string
        channel:
          $ref: '#/components/schemas/DistributionChannel'
        reference:
          type: string
    ReleaseOriginals:
      type: object
      required:
        - releasedTo
      properties:
        releasedTo:
          type: string
          minLength: 1
        courierReference:
          type: string
    SurrenderOriginals:
      type: object
      required:
        - count
      properties:
        count:
          type: integer
          minimum: 1
    AmendHouseBOL:
      type: object
      required:
        - reason
      properties:
        reason:
          type: string
          minLength: 1
        consigneeName:
          type: string
        consigneeAddress:
          type: string
        notifyPartyName:
          type: string
        notifyPartyAddress:
          type: string
        vesselName:
          type: string
        voyageNumber:
          type: string
        sealNumber:
          type: string
        cargoDescription:
          type: string
        weightKg:
          type: number
        pieces:
          type: integer
        cbm:
          type: number
        releaseType:
          $ref: '#/components/schemas/ReleaseType'
    VoidHouseBOL:
      type: object
      required:
        - reason
      properties:
        reason:
          type: string
          minLength: 1
    Preconditions:
      type: object
      description: What the Documentation track is waiting on, per booking.
      properties:
        bookingId:
          type: string
          format: uuid
        met:
          type: boolean
        containerNumber:
          type: string
        sealNumber:
          type: string
        itnNumber:
          type: string
        carrierBookingRef:
          type: string
        missing:
          type: array
          items:
            type: string
    Instructions:
      type: object
      properties:
        id:
          type: string
          format: uuid
        bookingId:
          type: string
          format: uuid
        instructionsReference:
          type: string
        status:
          $ref: '#/components/schemas/InstructionsStatus'
        supersedesInstructionsId:
          type: string
          format: uuid
        carrierBookingRef:
          type: string
        containerNumber:
          type: string
        sealNumber:
          type: string
        itnNumber:
          type: string
        shipperName:
          type: string
        shipperAddress:
          type: string
        consigneeName:
          type: string
        consigneeAddress:
          type: string
        notifyPartyName:
          type: string
        notifyPartyAddress:
          type: string
        portOfLoadingCode:
          type: string
        portOfDischargeCode:
          type: string
        vesselName:
          type: string
        voyageNumber:
          type: string
        cargoDescription:
          type: string
        hsCode:
          type: string
        actualWeightKg:
          type: number
        actualPieces:
          type: integer
        actualCbm:
          type: number
        marksAndNumbers:
          type: string
        freightTerms:
          $ref: '#/components/schemas/FreightTerms'
        draftedAt:
          type: string
          format: date-time
        draftedBy:
          type: string
        approvedAt:
          type: string
          format: date-time
        approvedBy:
          type: string
        sentAt:
          type: string
          format: date-time
        documentationCutOffDate:
          type: string
          format: date
        sentAfterCutOff:
          type: boolean
        carrierQuery:
          type: string
    Master:
      type: object
      properties:
        id:
          type: string
          format: uuid
        bookingId:
          type: string
          format: uuid
        instructionsId:
          type: string
          format: uuid
        masterBolNumber:
          type: string
        issuedByCarrierAt:
          type: string
          format: date-time
        receivedAt:
          type: string
          format: date-time
        receivedBy:
          type: string
        verificationStatus:
          $ref: '#/components/schemas/VerificationStatus'
        verifiedAt:
          type: string
          format: date-time
        verifiedBy:
          type: string
        discrepancyFields:
          type: array
          items:
            type: string
        discrepancyRaisedAt:
          type: string
          format: date-time
        discrepancyResolvedAt:
          type: string
          format: date-time
        documentFileReference:
          type: string
        verified:
          type: boolean
    Originals:
      type: object
      properties:
        id:
          type: string
          format: uuid
        originalsIssued:
          type: integer
        originalsSurrendered:
          type: integer
        outstanding:
          type: integer
        allSurrendered:
          type: boolean
        releasedAt:
          type: string
          format: date-time
        releasedTo:
          type: string
        courierReference:
          type: string
        surrenderedAt:
          type: string
          format: date-time
    Distribution:
      type: object
      properties:
        id:
          type: string
          format: uuid
        recipient:
          $ref: '#/components/schemas/DistributionRecipient'
        recipientName:
          type: string
        recipientAddress:
          type: string
        channel:
          $ref: '#/components/schemas/DistributionChannel'
        revisionNumber:
          type: integer
        sentAt:
          type: string
          format: date-time
        sentBy:
          type: string
        reference:
          type: string
    House:
      type: object
      properties:
        id:
          type: string
          format: uuid
        bookingId:
          type: string
          format: uuid
        masterBolId:
          type: string
          format: uuid
        houseBolNumber:
          type: string
        revisionNumber:
          type: integer
        active:
          type: boolean
        status:
          $ref: '#/components/schemas/HouseBOLStatus'
        releaseType:
          $ref: '#/components/schemas/ReleaseType'
        releaseTypeConfirmedAt:
          type: string
          format: date-time
        releaseTypeConfirmedBy:
          type: string
        shipperNameSnapshot:
          type: string
        shipperAddressSnapshot:
          type: string
        consigneeNameSnapshot:
          type: string
        consigneeAddressSnapshot:
          type: string
        notifyPartyNameSnapshot:
          type: string
        notifyPartyAddressSnapshot:
          type: string
        portOfLoadingCode:
          type: string
        portOfDischargeCode:
          type: string
        vesselName:
          type: string
        voyageNumber:
          type: string
        containerNumber:
          type: string
        sealNumber:
          type: string
        cargoDescription:
          type: string
        hsCode:
          type: string
        weightKg:
          type: number
        pieces:
          type: integer
        cbm:
          type: number
        marksAndNumbers:
          type: string
        freightTerms:
          $ref: '#/components/schemas/FreightTerms'
        issuedAt:
          type: string
          format: date-time
        issuedBy:
          type: string
        voidedAt:
          type: string
          format: date-time
        supersededByHouseBolId:
          type: string
          format: uuid
        amendmentReason:
          type: string
        pdfReference:
          type: string
        amendmentBlockedReason:
          type: string
          description: Why this revision cannot be amended, or null. Outstanding negotiable originals live here.
        originals:
          $ref: '#/components/schemas/Originals'
        distributions:
          type: array
          items:
            $ref: '#/components/schemas/Distribution'
